# Deploys examples/sample-workspace to a Fabric workspace on every push to
# main that changes it, deploying only what changed since the last
# successful run.
#
# Before using it:
# - Create a variable group named "fabric-prd" with FAB_CLIENT_ID,
#   FAB_TENANT_ID, FAB_CLIENT_SECRET (as a secret), FABRIC_WORKSPACE,
#   STATE_WORKSPACE and STATE_LAKEHOUSE. The last two name the lakehouse
#   that keeps the deployment state, in a workspace the service principal
#   can write to, such as one kept for operations.
# - Run one deployment at a time per workspace: for example, deploy to an
#   environment with an Exclusive Lock check. A second run would find the
#   deployment state locked, and fail.
# - Until the next pyfabricops release, install it from the repository, as
#   below; then pin the release instead: pip install "pyfabricops==<version>".

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - examples/sample-workspace

pool:
  vmImage: ubuntu-latest

variables:
  - group: fabric-prd

steps:
  - checkout: self
    # The whole history: the run compares commits.
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.13"

  - script: pip install "pyfabricops>=0.7.0,<0.8.0"
    displayName: Install pyfabricops

  # The state of the last successful run is read from the lakehouse, and
  # recorded there only when every item succeeds.
  - script: >
      python examples/04-deploy-selective/deploy.py
      --workspace "$(FABRIC_WORKSPACE)"
      --environment PRD
      --state-workspace "$(STATE_WORKSPACE)"
      --state-lakehouse "$(STATE_LAKEHOUSE)"
    displayName: Deploy
    env:
      # Secret variables reach a script only when mapped.
      FAB_CLIENT_ID: $(FAB_CLIENT_ID)
      FAB_TENANT_ID: $(FAB_TENANT_ID)
      FAB_CLIENT_SECRET: $(FAB_CLIENT_SECRET)
