# Deploys examples/sample-workspace to a Fabric workspace on every push to
# main that changes it, deploying only what changed since the last
# successful run.
#
# Before using it:
# - Copy this file to .github/workflows/ (it does not run from here).
# - Create an environment named "prd" with the secrets FAB_CLIENT_ID,
#   FAB_CLIENT_SECRET and FAB_TENANT_ID, and the variables FABRIC_WORKSPACE,
#   STATE_WORKSPACE and STATE_LAKEHOUSE. The last two name the lakehouse
#   that keeps the deployment state, in a workspace the service principal
#   can write to, such as one kept for operations.
# - Until the next pyfabricops release, install it from the repository, as
#   below; then pin the release instead: pip install "pyfabricops==<version>".

name: Deploy to Fabric

on:
  push:
    branches:
      - main
    paths:
      - examples/sample-workspace/**
  workflow_dispatch:

# One deployment at a time: a second run would wait for the lock of the
# deployment state anyway, and fail.
concurrency:
  group: deploy-prd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the run compares commits.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pyfabricops
        run: pip install "pyfabricops>=0.7.0,<0.8.0"

      # The state of the last successful run is read from the lakehouse, and
      # recorded there only when every item succeeds.
      - name: Deploy
        run: >
          python examples/04-deploy-selective/deploy.py
          --workspace "${{ vars.FABRIC_WORKSPACE }}"
          --environment PRD
          --state-workspace "${{ vars.STATE_WORKSPACE }}"
          --state-lakehouse "${{ vars.STATE_LAKEHOUSE }}"
        env:
          FAB_CLIENT_ID: ${{ secrets.FAB_CLIENT_ID }}
          FAB_CLIENT_SECRET: ${{ secrets.FAB_CLIENT_SECRET }}
          FAB_TENANT_ID: ${{ secrets.FAB_TENANT_ID }}
