# Reports drift on weekday mornings: compares main with the Fabric
# workspace and fails when anything differs, so that someone looks. It
# never changes the workspace.
#
# Before using it:
# - Copy this file to .github/workflows/ (it does not run from here).
# - It uses the "prd" environment of 06-ci-github-actions, and reads the
#   deployment state from the lakehouse that workflow keeps it in, to tell
#   drift from a deployment still to run. It never saves the state.
# - To bring back what drifted instead of failing, add --restore to the
#   Reconcile step.
# - Until the next pyfabricops release, install it from the repository, as
#   below; then pin the release instead: pip install "pyfabricops==<version>".

name: Reconcile Fabric

on:
  schedule:
    # 06:00 UTC, Monday to Friday.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pyfabricops
        run: pip install "pyfabricops @ git+https://github.com/alisonpezzott/pyfabricops"

      - name: Reconcile
        run: >
          python examples/07-reconcile/reconcile.py
          --workspace "${{ vars.FABRIC_WORKSPACE }}"
          --environment PRD
          --state-workspace "${{ vars.STATE_WORKSPACE }}"
          --state-lakehouse "${{ vars.STATE_LAKEHOUSE }}"
        env:
          FAB_CLIENT_ID: ${{ secrets.FAB_CLIENT_ID }}
          FAB_CLIENT_SECRET: ${{ secrets.FAB_CLIENT_SECRET }}
          FAB_TENANT_ID: ${{ secrets.FAB_TENANT_ID }}
